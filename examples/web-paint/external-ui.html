<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>無題 — ペイント</title>
    <link rel="stylesheet" href="./external-ui.css" />
    <script type="module" src="./external-ui.js"></script>
  </head>
  <body>
    <header class="menubar">
      <strong id="document-name">無題</strong>
      <details class="menu">
        <summary>ファイル</summary>
        <div class="menu-items">
          <button data-action="import">
            <img src="./assets/icons/open.svg" alt="" />画像を開く
          </button>
          <button data-action="save">
            <img src="./assets/icons/save.svg" alt="" />保存
          </button>
          <button data-action="save-as">名前を付けて保存</button>
          <button data-action="download">PNGをダウンロード…</button>
          <button data-action="sample">
            <img src="./assets/icons/image.svg" alt="" />サンプルを開く
          </button>
        </div>
      </details>
      <details class="menu">
        <summary>編集</summary>
        <div class="menu-items">
          <button data-action="add">レイヤーを追加</button>
          <button data-action="clear">選択レイヤーをクリア…</button>
        </div>
      </details>
      <details class="menu">
        <summary>表示</summary>
        <div class="menu-items">
          <button data-action="fit">画面に合わせる</button>
          <button data-action="actual">実際のサイズ（100%）</button>
        </div>
      </details>
      <span class="app-name">ペイント</span>
    </header>
    <section class="ribbon" aria-label="描画の設定">
      <nav class="tabs" aria-label="リボン">
        <button class="tab active" data-panel="home" aria-pressed="true">
          ホーム
        </button>
        <button class="tab" data-panel="draw" aria-pressed="false">描く</button>
        <button class="tab" disabled title="範囲選択は未対応です">選択</button>
        <button class="tab" disabled title="図形ツールは未対応です">
          図形
        </button>
        <button class="tab" data-panel="color" aria-pressed="false">色</button>
        <button class="tab" data-panel="canvas" aria-pressed="false">
          キャンバス
        </button>
      </nav>
      <div class="ribbon-content">
        <div
          id="ribbon-tools"
          class="tool-group"
          role="toolbar"
          aria-label="描画ツール"
        ></div>
        <div class="brush-settings" id="brush-settings">
          <label for="size">ブラシの大きさ</label
          ><input id="size" type="range" min="1" max="100" value="5" /><input
            id="size-value"
            aria-label="ブラシの大きさ（数値）"
            type="number"
            min="1"
            max="100"
            value="5"
          />
          <label for="opacity">レイヤーの不透明度</label
          ><input
            id="opacity"
            type="range"
            min="0"
            max="100"
            value="100"
          /><output id="opacity-value">100%</output> <span>線の種類</span>
          <div class="line-style" title="実線ブラシ">
            <span></span><small>実線</small>
          </div>
        </div>
        <div class="context-actions" id="context-actions" hidden></div>
      </div>
    </section>
    <main class="workspace">
      <aside
        id="side-tools"
        class="side-tools"
        role="toolbar"
        aria-label="ツール"
      ></aside>
      <section class="canvas-area" aria-label="キャンバスの作業領域">
        <div class="canvas-stage">
          <div id="eyedropper-preview" class="eyedropper-preview" hidden>
            <span id="eyedropper-swatch" aria-hidden="true"></span>
            <span class="eyedropper-values">
              <strong id="eyedropper-hex">—</strong>
              <small id="eyedropper-details">キャンバスをポイント</small>
            </span>
            <small class="eyedropper-help">クリック / Enterで取得 · Escで取消</small>
          </div>
          <wasm-paint-tool
            controls="external"
            width="640"
            height="480"
            webmcp
          ></wasm-paint-tool>
        </div>
      </section>
      <aside class="sidebar" aria-label="色とレイヤー">
        <section class="panel color-panel">
          <h2>
            色<button
              class="collapse"
              aria-label="色パネルを折りたたむ"
              aria-expanded="true"
            >
              <img src="./assets/icons/chevron.svg" alt="" />
            </button>
          </h2>
          <div class="panel-body">
            <div id="palette" class="palette" aria-label="カラーパレット"></div>
            <div class="color-editor">
              <canvas
                id="color-wheel"
                width="240"
                height="240"
                aria-label="色相環。キーボードでは下の色入力を使用してください"
              ></canvas>
              <div class="current-colors">
                <input
                  id="color"
                  type="color"
                  value="#ffe331"
                  aria-label="描画色"
                /><button
                  id="white"
                  aria-label="白を選択"
                  title="白を選択"
                ></button>
              </div>
            </div>
            <label class="hex-label" for="hex"
              >色の値<input
                id="hex"
                value="#FFE331"
                maxlength="7"
                pattern="#[0-9a-fA-F]{6}"
                spellcheck="false"
                aria-label="描画色の16進数"
            /></label>
          </div>
        </section>
        <section class="panel layer-panel">
          <h2>
            レイヤー<button
              class="collapse"
              aria-label="レイヤーパネルを折りたたむ"
              aria-expanded="true"
            >
              <img src="./assets/icons/chevron.svg" alt="" />
            </button>
          </h2>
          <div class="panel-body">
            <div id="layers" class="layer-list" aria-label="レイヤー一覧"></div>
            <button id="add-layer" class="add-layer" data-action="add">
              <span><img src="./assets/icons/add.svg" alt="" /></span
              >レイヤーの追加
            </button>
          </div>
        </section>
      </aside>
    </main>
    <footer class="statusbar">
      <span class="dimensions">640 × 480 px</span
      ><span id="status" role="status" aria-live="polite">読み込み中…</span>
      <div class="zoom-controls">
        <button data-action="zoom-out" aria-label="縮小">
          <img src="./assets/icons/subtract.svg" alt="" /></button
        ><button id="zoom-value" data-action="actual" title="100%に戻す">
          100%</button
        ><input
          id="zoom"
          aria-label="表示倍率"
          type="range"
          min="25"
          max="200"
          step="1"
          value="100"
        /><button data-action="zoom-in" aria-label="拡大">
          <img src="./assets/icons/add.svg" alt="" />
        </button>
      </div>
    </footer>
    <input id="image" type="file" accept="image/*" hidden />
    <dialog id="clear-dialog">
      <form method="dialog">
        <h2>レイヤーをクリアしますか？</h2>
        <p>選択したレイヤーの描画が消去されます。この操作は元に戻せません。</p>
        <div>
          <button value="cancel">キャンセル</button
          ><button value="clear" class="primary">クリア</button>
        </div>
      </form>
    </dialog>
    <dialog id="save-dialog">
      <form method="dialog" id="save-form">
        <h2>PNGをダウンロード</h2>
        <p>PNGファイルをダウンロードします。保存先はブラウザーで確認してください。</p>
        <label for="save-filename">ファイル名</label>
        <div class="save-filename-row">
          <input id="save-filename" type="text" required maxlength="120" autocomplete="off" />
          <span>.png</span>
        </div>
        <div class="dialog-actions">
          <button id="save-cancel" type="button">キャンセル</button>
          <button id="save-download" class="primary" type="submit" value="download">ダウンロード</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
